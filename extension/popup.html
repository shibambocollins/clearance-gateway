<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clearance Gateway Lens</title>
    <style>
      /* FinMe design system tokens (docs/decisions.md D-057). No web fonts are fetched: Lens makes
         no network requests except to the Clearance Gateway API. */
      :root {
        --paper: #fbfaf7; --card: #ffffff; --stone: #f1efe8; --line: #e3e1d9; --input-border: #c9c5b8;
        --ink: #14140f; --ink-60: #5c5b52; --ink-50: #6b6a61; --ink-30: #a8a497;
        --forest: #12503a; --forest-deep: #0a3527; --forest-wash: #e4eee7; --forest-border: #bfd6c8;
        --sage: #7d8b6a; --sage-deep: #56633f; --sage-wash: #eef1e7; --sage-border: #d3dbc6;
        --clay: #a65d3a; --clay-deep: #7a3f24; --clay-wash: #fbf3ee; --clay-border: #e7d5c8;
        --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body { font: 14px/1.5 var(--sans); width: 360px; margin: 0; color: var(--ink-60); background: var(--paper); }
      header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); background: var(--card); }
      header img { width: 32px; height: 32px; }
      .brand { display: flex; flex-direction: column; line-height: 1.15; }
      .brand strong { font-size: 16px; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); }
      .brand span { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-50); }
      main { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 12px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
      .label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-50); margin: 0 0 8px; }
      .setting { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); }
      .setting + .setting { margin-top: 10px; }
      select { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--card); border: 1.5px solid var(--input-border); border-radius: 7px; padding: 6px 8px; }
      textarea { width: 100%; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--card); border: 1.5px solid var(--input-border); border-radius: 7px; padding: 8px 10px; min-height: 76px; resize: vertical; }
      select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--forest); box-shadow: 0 0 0 3px rgba(18, 80, 58, 0.14); }
      textarea::placeholder { color: var(--ink-30); }
      /* On/off switch: a styled checkbox, so it stays keyboard and screen-reader friendly. */
      .switch { appearance: none; width: 38px; height: 22px; border-radius: 11px; background: var(--input-border); position: relative; cursor: pointer; flex: 0 0 auto; transition: background 120ms ease; margin: 0; }
      .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); transition: transform 120ms ease; }
      .switch:checked { background: var(--forest); }
      .switch:checked::after { transform: translateX(16px); }
      .switch:focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }
      button { font: inherit; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 6px 14px; border-radius: 7px; border: 1.5px solid var(--input-border); background: transparent; color: var(--ink-60); cursor: pointer; transition: transform 90ms ease, box-shadow 90ms ease; }
      button:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
      button.primary { background: var(--forest); border-color: var(--forest-deep); color: var(--paper); box-shadow: 3px 3px 0 var(--forest-deep); }
      button.primary:hover:not(:disabled) { color: var(--paper); transform: translate(1.5px, 1.5px); box-shadow: 1.5px 1.5px 0 var(--forest-deep); }
      button.danger { border-color: #c79877; color: var(--clay); }
      button:disabled { opacity: 0.55; cursor: default; transform: none; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
      .site-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #site-name { font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
      .tag { display: inline-block; padding: 2px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--stone); font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-50); white-space: nowrap; }
      .tag.on, .tag.allowed { background: var(--forest-wash); border-color: var(--forest-border); color: var(--forest); }
      .tag.placeholder { background: var(--sage-wash); border-color: var(--sage-border); color: var(--sage-deep); }
      .tag.blocked { background: var(--clay-wash); border-color: var(--clay-border); color: var(--clay-deep); }
      .muted { color: var(--ink-50); font-size: 12.5px; margin: 6px 0 0; }
      .result { border-top: 3px solid var(--forest); }
      .result.modify { border-top-color: var(--sage); }
      .result.blocked, .result.error { border-top-color: var(--clay); }
      .result h2 { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); margin: 0 0 6px; }
      .result p { margin: 0 0 6px; }
      .findings { list-style: none; padding: 0; margin: 6px 0; }
      .findings li { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
      .findings code { font-family: var(--mono); font-size: 12px; color: var(--ink); background: var(--stone); border-radius: 4px; padding: 1px 6px; }
      .rule { font-family: var(--mono); font-size: 10px; color: var(--ink-50); }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: 12px/1.45 var(--mono); color: var(--ink); max-height: 160px; overflow: auto; margin: 4px 0 0; }
      footer { padding: 0 16px 14px; font-size: 12.5px; color: var(--ink-50); }
      a { color: var(--forest); font-weight: 600; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .hidden { display: none !important; }
      @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.001ms !important; } }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" />
      <div class="brand"><strong>Lens</strong><span>Clearance Gateway</span></div>
    </header>

    <main>
      <section id="settings" class="card">
        <label class="setting">Check messages before sending <input type="checkbox" id="enabled" class="switch" /></label>
        <label class="setting">
          Demo role
          <select id="role">
            <option value="general">General staff</option>
            <option value="hr">HR</option>
            <option value="finance">Finance</option>
            <option value="engineering">Engineering</option>
          </select>
        </label>
      </section>

      <section id="site-card" class="card">
        <p class="label">This site</p>
        <div class="site-line">
          <span id="site-name">–</span>
          <span id="site-status" class="tag hidden"></span>
        </div>
        <div class="row">
          <button id="protect" type="button" class="primary hidden">Protect this site</button>
          <button id="unprotect" type="button" class="danger hidden">Stop protecting</button>
        </div>
        <p id="site-note" class="muted"></p>
      </section>

      <section id="quick-card" class="card">
        <p class="label">Quick check</p>
        <textarea id="quick-text" placeholder="Paste text to check before using it in any AI tool…" maxlength="12000"></textarea>
        <div class="row"><button id="quick-check" type="button" class="primary">Check</button></div>
      </section>

      <section id="result" class="card result hidden" aria-live="polite"></section>
    </main>

    <footer>
      Select text on any page, right-click and choose <strong>Check with Clearance Gateway</strong>. Text is checked by the
      Clearance Gateway API and never stored. <a id="assistant" target="_blank" rel="noreferrer">Open the approved assistant</a>
    </footer>
    <script src="lens-model.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
